    <text y="4" text-anchor="middle" font-family="'Neue Haas Grotesk Roman', sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#111111">5-STAR</text>
    <text y="20" text-anchor="middle" font-family="'Neue Haas Grotesk Roman', sans-serif" font-size="8" letter-spacing="1.5" fill="#8c6c39">EXEMPLARY 2024</text>
