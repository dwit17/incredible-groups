<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c17"/>
      <stop offset="60%" stop-color="#1b2920"/>
      <stop offset="100%" stop-color="#0c120e"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="625" fill="url(#p2-bg)"/>
  
  <!-- Biophilic Forest Pavilion Layout -->
  <rect x="220" y="160" width="560" height="280" fill="#243329" stroke="#c8a97e" stroke-width="2"/>
  
  <!-- Water Reflection Pool -->
  <polygon points="120,440 880,440 940,560 60,560" fill="#1b4d3e" fill-opacity="0.6" stroke="#4fa1d8" stroke-width="1"/>
  
  <!-- Stone Louvers -->
  <g stroke="#dfc298" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="260" y1="160" x2="260" y2="440"/>
    <line x1="320" y1="160" x2="320" y2="440"/>
    <line x1="380" y1="160" x2="380" y2="440"/>
    <line x1="440" y1="160" x2="440" y2="440"/>
    <line x1="500" y1="160" x2="500" y2="440"/>
    <line x1="560" y1="160" x2="560" y2="440"/>
    <line x1="620" y1="160" x2="620" y2="440"/>
    <line x1="680" y1="160" x2="680" y2="440"/>
    <line x1="740" y1="160" x2="740" y2="440"/>
  </g>

  <text x="50" y="580" fill="#f3f3f4" font-family="'Neue Haas Grotesk Roman', sans-serif" font-size="24" letter-spacing="4">SANCTUARY OF SOLITUDE</text>
  <text x="50" y="605" fill="#c8a97e" font-family="'Neue Haas Grotesk Light', sans-serif" font-size="12" letter-spacing="2">ASSAGAO HILLS, GOA • 18 ACRE PRIVATE ESTATES</text>
</svg>
