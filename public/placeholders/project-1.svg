<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="p1-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181d"/>
      <stop offset="50%" stop-color="#1e232a"/>
      <stop offset="100%" stop-color="#2d333b"/>
    </linearGradient>
    <linearGradient id="p1-tower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a97e" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#dfc298" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#5a4d3a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1c1915" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#p1-sky)"/>
  
  <!-- Sea Horizon Line -->
  <line x1="0" y1="780" x2="800" y2="780" stroke="#c8a97e" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect y="780" width="800" height="220" fill="#0c0e11"/>
  
  <!-- Architectural Monolith Silhouette -->
  <polygon points="260,120 540,120 500,820 220,820" fill="url(#p1-tower)"/>
  
  <!-- Cantilevered Terraces & Floor Plates -->
  <g stroke="#f3f3f4" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="250" y1="180" x2="550" y2="180"/>
    <line x1="240" y1="240" x2="560" y2="240"/>
    <line x1="230" y1="300" x2="570" y2="300"/>
    <line x1="220" y1="360" x2="580" y2="360"/>
    <line x1="210" y1="420" x2="590" y2="420"/>
    <line x1="200" y1="480" x2="600" y2="480"/>
    <line x1="190" y1="540" x2="610" y2="540"/>
    <line x1="180" y1="600" x2="620" y2="600"/>
    <line x1="170" y1="660" x2="630" y2="660"/>
    <line x1="160" y1="720" x2="640" y2="720"/>
  </g>

  <!-- Sky Pool Cutout -->
  <rect x="340" y="440" width="200" height="40" fill="#4fa1d8" fill-opacity="0.4" stroke="#c8a97e" stroke-width="2"/>
  
  <text x="50" y="940" fill="#f3f3f4" font-family="'Neue Haas Grotesk Roman', sans-serif" font-size="28" letter-spacing="4">THE AURUM MONOLITH</text>
  <text x="50" y="970" fill="#c8a97e" font-family="'Neue Haas Grotesk Light', sans-serif" font-size="14" letter-spacing="3">WORLI SEA FACE, MUMBAI • 2025</text>
</svg>
