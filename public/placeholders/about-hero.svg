  </g>

  <text x="80" y="740" fill="#f3f3f4" font-family="'Neue Haas Grotesk Roman', sans-serif" font-size="32" letter-spacing="6">INCREDIBLE GROUPS ATELIER &amp; RESEARCH ARCHIVE</text>
